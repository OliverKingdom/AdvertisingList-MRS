name: Build AdvertisingLite MRS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq gzip python3 python3-yaml file

      # ============================================================
      # 3. Download latest mihomo
      # ============================================================
      - name: Install mihomo
        shell: bash
        run: |
          set -e

          echo "Finding latest mihomo..."

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '
              .assets[]
              | select(.name | test("linux-amd64.*\\.gz$"))
              | .browser_download_url
            ' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: mihomo linux-amd64 release not found"
            exit 1
          fi

          echo "Download:"
          echo "$URL"

          curl -fL "$URL" -o /tmp/mihomo.gz

          gzip -dc /tmp/mihomo.gz > /tmp/mihomo

          chmod +x /tmp/mihomo

          sudo mv /tmp/mihomo /usr/local/bin/mihomo

          echo "mihomo version:"
          mihomo -v

      # ============================================================
      # 4. Download AdvertisingLite
      # ============================================================
      - name: Download AdvertisingLite
        shell: bash
        run: |
          set -e

          mkdir -p source

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.list" \
            -o source/AdvertisingLite.yaml

          echo "Downloaded source:"
          wc -l source/AdvertisingLite.yaml

          echo
          echo "First lines:"
          head -n 20 source/AdvertisingLite.yaml

      # ============================================================
      # 5. Extract DOMAIN / DOMAIN-SUFFIX / KEYWORD / IP
      # ============================================================
      - name: Extract rules
        shell: python3 {0}
        run: |
          from pathlib import Path
          import yaml

          src = Path("source/AdvertisingLite.yaml")
          data = yaml.safe_load(src.read_text(encoding="utf-8"))

          payload = data.get("payload", [])

          domains = []
          keywords = []
          ips = []

          for item in payload:

              if not isinstance(item, str):
                  continue

              item = item.strip()

              if not item:
                  continue

              parts = [x.strip() for x in item.split(",")]

              if not parts:
                  continue

              rule_type = parts[0].upper()

              # --------------------------------------------------
              # DOMAIN
              # --------------------------------------------------
              if rule_type == "DOMAIN":

                  if len(parts) >= 2:
                      domain = parts[1].strip()

                      if domain:
                          domains.append(domain)

              # --------------------------------------------------
              # DOMAIN-SUFFIX
              # --------------------------------------------------
              elif rule_type == "DOMAIN-SUFFIX":

                  if len(parts) >= 2:
                      domain = parts[1].strip()

                      if domain:
                          # Mihomo domain list:
                          # +.example.com = suffix
                          domains.append("+." + domain.lstrip("."))

              # --------------------------------------------------
              # DOMAIN-KEYWORD
              # --------------------------------------------------
              elif rule_type == "DOMAIN-KEYWORD":

                  if len(parts) >= 2:
                      keyword = parts[1].strip()

                      if keyword:
                          keywords.append(
                              f"DOMAIN-KEYWORD,{keyword}"
                          )

              # --------------------------------------------------
              # IP-CIDR / IP-CIDR6
              # --------------------------------------------------
              elif rule_type in ("IP-CIDR", "IP-CIDR6"):

                  if len(parts) >= 2:
                      ip = parts[1].strip()

                      if ip:
                          ips.append(ip)

          # ------------------------------------------------------
          # Deduplicate
          # ------------------------------------------------------
          domains = list(dict.fromkeys(domains))
          keywords = list(dict.fromkeys(keywords))
          ips = list(dict.fromkeys(ips))

          out = Path("rules")
          out.mkdir(exist_ok=True)

          # ------------------------------------------------------
          # IMPORTANT:
          # Domain MRS source = TEXT
          # One domain per line
          # ------------------------------------------------------
          (out / "AdvertisingLite-Domain.txt").write_text(
              "\n".join(domains) + "\n",
              encoding="utf-8"
          )

          # Classical keyword rules
          (out / "AdvertisingLite-Keyword.yaml").write_text(
              yaml.safe_dump(
                  {"payload": keywords},
                  allow_unicode=True,
                  sort_keys=False
              ),
              encoding="utf-8"
          )

          # IP source = TEXT
          (out / "AdvertisingLite-IP.txt").write_text(
              "\n".join(ips) + "\n",
              encoding="utf-8"
          )

          print()
          print("=" * 60)
          print("AdvertisingLite statistics")
          print("=" * 60)
          print(f"DOMAIN + DOMAIN-SUFFIX : {len(domains):,}")
          print(f"DOMAIN-KEYWORD         : {len(keywords):,}")
          print(f"IP-CIDR / IP-CIDR6     : {len(ips):,}")
          print(
              f"TOTAL                  : "
              f"{len(domains) + len(keywords) + len(ips):,}"
          )
          print("=" * 60)

          if not domains:
              raise SystemExit(
                  "ERROR: DOMAIN list is empty!"
              )

          if not ips:
              print("WARNING: IP list is empty")

      # ============================================================
      # 6. Validate domain source BEFORE MRS
      # ============================================================
      - name: Validate domain list
        shell: bash
        run: |
          set -e

          echo "Domain rules:"
          wc -l rules/AdvertisingLite-Domain.txt

          echo
          echo "First 20:"
          head -n 20 rules/AdvertisingLite-Domain.txt

          echo
          echo "Last 20:"
          tail -n 20 rules/AdvertisingLite-Domain.txt

          COUNT=$(grep -cve '^[[:space:]]*$' \
            rules/AdvertisingLite-Domain.txt || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Domain list is empty"
            exit 1
          fi

          echo
          echo "Valid domain entries: $COUNT"

      # ============================================================
      # 7. Convert DOMAIN -> MRS
      # ============================================================
      - name: Convert Domain to MRS
        shell: bash
        run: |
          set -e

          echo "Converting domain list..."

          mihomo convert-ruleset \
            domain \
            text \
            rules/AdvertisingLite-Domain.txt \
            rules/AdvertisingLite-Domain.mrs

          echo
          echo "Domain MRS created:"
          ls -lh rules/AdvertisingLite-Domain.mrs

      # ============================================================
      # 8. Convert IP -> MRS
      # ============================================================
      - name: Convert IP to MRS
        shell: bash
        run: |
          set -e

          if [ ! -s rules/AdvertisingLite-IP.txt ]; then
            echo "No IP rules. Skip IP MRS."
            exit 0
          fi

          echo "Converting IP list..."

          mihomo convert-ruleset \
            ipcidr \
            text \
            rules/AdvertisingLite-IP.txt \
            rules/AdvertisingLite-IP.mrs

          echo
          echo "IP MRS created:"
          ls -lh rules/AdvertisingLite-IP.mrs

      # ============================================================
      # 9. Verify MRS
      # ============================================================
      - name: Verify MRS
        shell: bash
        run: |
          set -e

          echo "Testing Domain MRS..."

          mihomo convert-ruleset \
            domain \
            mrs \
            rules/AdvertisingLite-Domain.mrs \
            /tmp/AdvertisingLite-Domain-verify.txt

          DOMAIN_COUNT=$(wc -l < /tmp/AdvertisingLite-Domain-verify.txt)

          echo "Domain MRS entries:"
          echo "$DOMAIN_COUNT"

          if [ "$DOMAIN_COUNT" -eq 0 ]; then
            echo "ERROR: Domain MRS contains 0 rules!"
            exit 1
          fi

          echo
          echo "Domain MRS verification OK."

          if [ -f rules/AdvertisingLite-IP.mrs ]; then

            echo
            echo "Testing IP MRS..."

            mihomo convert-ruleset \
              ipcidr \
              mrs \
              rules/AdvertisingLite-IP.mrs \
              /tmp/AdvertisingLite-IP-verify.txt

            IP_COUNT=$(wc -l < /tmp/AdvertisingLite-IP-verify.txt)

            echo "IP MRS entries:"
            echo "$IP_COUNT"

          fi

      # ============================================================
      # 10. Remove intermediate files
      # ============================================================
      - name: Cleanup
        run: |
          rm -f rules/AdvertisingLite-Domain.txt
          rm -f rules/AdvertisingLite-IP.txt

          echo
          echo "Final files:"
          ls -lh rules/

      # ============================================================
      # 11. README
      # ============================================================
      - name: Create README
        shell: bash
        run: |
          cat > rules/README.md <<'EOF'
          # AdvertisingLite MRS

          Generated automatically from Blackmatrix7 AdvertisingLite.

          ## Files

          ### AdvertisingLite-Domain.mrs

          Contains:

          - DOMAIN
          - DOMAIN-SUFFIX

          Format:

          - behavior: domain
          - format: mrs

          ### AdvertisingLite-Keyword.yaml

          Contains:

          - DOMAIN-KEYWORD

          This remains classical YAML because DOMAIN-KEYWORD cannot be represented by domain MRS without changing its matching semantics.

          ### AdvertisingLite-IP.mrs

          Contains:

          - IP-CIDR
          - IP-CIDR6

          Format:

          - behavior: ipcidr
          - format: mrs

          ## Stash

          ```yaml
          rule-providers:

            AdvertisingLite-Domain:
              type: http
              behavior: domain
              format: mrs
              url: https://raw.githubusercontent.com/USERNAME/REPOSITORY/main/rules/AdvertisingLite-Domain.mrs
              interval: 86400

            AdvertisingLite-Keyword:
              type: http
              behavior: classical
              format: yaml
              url: https://raw.githubusercontent.com/USERNAME/REPOSITORY/main/rules/AdvertisingLite-Keyword.yaml
              interval: 86400

            AdvertisingLite-IP:
              type: http
              behavior: ipcidr
              format: mrs
              url: https://raw.githubusercontent.com/USERNAME/REPOSITORY/main/rules/AdvertisingLite-IP.mrs
              interval: 86400

          rules:

            - RULE-SET,AdvertisingLite-Domain,REJECT
            - RULE-SET,AdvertisingLite-Keyword,REJECT
            - RULE-SET,AdvertisingLite-IP,REJECT,no-resolve
          ```

          EOF

      # ============================================================
      # 12. Commit
      # ============================================================
      - name: Commit
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update AdvertisingLite MRS"
          git push
name: Build AdvertisingLite Rule Sets

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 04:00 左右运行
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq gzip python3


      # ============================================================
      # 3. Download latest mihomo
      # ============================================================
      - name: Install mihomo
        shell: bash
        run: |
          set -e

          echo "Finding latest mihomo release..."

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '
              .assets[]
              | select(.name | test("linux-amd64.*(gz|zip)$"))
              | .browser_download_url
            ' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Cannot find mihomo linux-amd64 release."
            exit 1
          fi

          echo "Downloading:"
          echo "$URL"

          curl -fL "$URL" -o /tmp/mihomo.pkg

          mkdir -p /tmp/mihomo

          if file /tmp/mihomo.pkg | grep -qi gzip; then
            gzip -dc /tmp/mihomo.pkg > /tmp/mihomo/mihomo
          elif file /tmp/mihomo.pkg | grep -qi zip; then
            sudo apt-get install -y unzip
            unzip -o /tmp/mihomo.pkg -d /tmp/mihomo
          else
            cp /tmp/mihomo.pkg /tmp/mihomo/mihomo
          fi

          MIHOMO_BIN=$(find /tmp/mihomo -type f -name "mihomo" | head -n 1)

          if [ -z "$MIHOMO_BIN" ]; then
            echo "ERROR: mihomo binary not found."
            find /tmp/mihomo -maxdepth 2 -type f
            exit 1
          fi

          chmod +x "$MIHOMO_BIN"

          sudo cp "$MIHOMO_BIN" /usr/local/bin/mihomo

          mihomo -v


      # ============================================================
      # 4. Download original AdvertisingLite
      #
      # This is the original Clash YAML from blackmatrix7.
      # ============================================================
      - name: Download AdvertisingLite source
        shell: bash
        run: |
          set -e

          mkdir -p source

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.yaml" \
            -o source/AdvertisingLite.yaml

          echo "Source downloaded:"
          wc -l source/AdvertisingLite.yaml

          head -n 15 source/AdvertisingLite.yaml


      # ============================================================
      # 5. Split original rules
      #
      # DOMAIN
      # DOMAIN-SUFFIX
      #       -> domain YAML
      #
      # DOMAIN-KEYWORD
      #       -> classical YAML
      #
      # IP-CIDR / IP-CIDR6
      #       -> ipcidr YAML
      # ============================================================
      - name: Split AdvertisingLite rules
        shell: python3 {0}
        run: |
          from pathlib import Path
          import yaml
          import re

          source = Path("source/AdvertisingLite.yaml")

          text = source.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Read YAML
          # --------------------------------------------------------
          data = yaml.safe_load(text)

          payload = data.get("payload", [])

          domain_rules = []
          keyword_rules = []
          ip_rules = []

          for item in payload:

              if not isinstance(item, str):
                  continue

              item = item.strip()

              if not item:
                  continue

              parts = [x.strip() for x in item.split(",")]

              rule_type = parts[0].upper()

              if rule_type == "DOMAIN":
                  if len(parts) >= 2:
                      domain = parts[1].strip()
                      if domain:
                          domain_rules.append(domain)

              elif rule_type == "DOMAIN-SUFFIX":
                  if len(parts) >= 2:
                      domain = parts[1].strip().lstrip(".")
                      if domain:
                          # Mihomo/Stash domain rule:
                          # +.example.com = example.com + all subdomains
                          domain_rules.append("+." + domain)

              elif rule_type == "DOMAIN-KEYWORD":
                  if len(parts) >= 2:
                      keyword = parts[1].strip()

                      if keyword:
                          # Preserve the original rule exactly.
                          keyword_rules.append(
                              "DOMAIN-KEYWORD," + keyword + ",REJECT"
                          )

              elif rule_type in ("IP-CIDR", "IP-CIDR6"):
                  if len(parts) >= 2:
                      ip = parts[1].strip()

                      if ip:
                          ip_rules.append(ip)

          # --------------------------------------------------------
          # Deduplicate while preserving order
          # --------------------------------------------------------
          def unique(items):
              return list(dict.fromkeys(items))

          domain_rules = unique(domain_rules)
          keyword_rules = unique(keyword_rules)
          ip_rules = unique(ip_rules)

          # --------------------------------------------------------
          # Create output directory
          # --------------------------------------------------------
          out = Path("rules")
          out.mkdir(parents=True, exist_ok=True)

          # --------------------------------------------------------
          # DOMAIN MRS source YAML
          #
          # IMPORTANT:
          # DOMAIN-SUFFIX is converted to +.domain
          # DOMAIN remains an exact domain.
          # --------------------------------------------------------
          domain_yaml = {
              "payload": domain_rules
          }

          (out / "AdvertisingLite-Domain.yaml").write_text(
              yaml.safe_dump(
                  domain_yaml,
                  allow_unicode=True,
                  sort_keys=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # DOMAIN-KEYWORD classical YAML
          #
          # We DO NOT convert these to MRS.
          # --------------------------------------------------------
          keyword_yaml = {
              "payload": keyword_rules
          }

          (out / "AdvertisingLite-Keyword.yaml").write_text(
              yaml.safe_dump(
                  keyword_yaml,
                  allow_unicode=True,
                  sort_keys=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # IP-CIDR MRS source YAML
          # --------------------------------------------------------
          ip_yaml = {
              "payload": ip_rules
          }

          (out / "AdvertisingLite-IP.yaml").write_text(
              yaml.safe_dump(
                  ip_yaml,
                  allow_unicode=True,
                  sort_keys=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Statistics
          # --------------------------------------------------------
          print()
          print("=" * 60)
          print("AdvertisingLite build statistics")
          print("=" * 60)
          print(f"DOMAIN + DOMAIN-SUFFIX : {len(domain_rules):,}")
          print(f"DOMAIN-KEYWORD         : {len(keyword_rules):,}")
          print(f"IP-CIDR/IP-CIDR6       : {len(ip_rules):,}")
          print(f"TOTAL                  : {len(domain_rules) + len(keyword_rules) + len(ip_rules):,}")
          print("=" * 60)


      # ============================================================
      # 6. Convert DOMAIN YAML -> MRS
      # ============================================================
      - name: Convert Domain to MRS
        shell: bash
        run: |
          set -e

          mihomo convert-ruleset \
            domain \
            yaml \
            rules/AdvertisingLite-Domain.yaml \
            rules/AdvertisingLite-Domain.mrs

          ls -lh rules/AdvertisingLite-Domain.mrs


      # ============================================================
      # 7. Convert IP YAML -> MRS
      # ============================================================
      - name: Convert IP to MRS
        shell: bash
        run: |
          set -e

          mihomo convert-ruleset \
            ipcidr \
            yaml \
            rules/AdvertisingLite-IP.yaml \
            rules/AdvertisingLite-IP.mrs

          ls -lh rules/AdvertisingLite-IP.mrs


      # ============================================================
      # 8. Remove intermediate YAML files
      #
      # Keep Keyword YAML because Stash needs it.
      # ============================================================
      - name: Clean intermediate files
        run: |
          rm -f rules/AdvertisingLite-Domain.yaml
          rm -f rules/AdvertisingLite-IP.yaml

          echo "Final files:"
          ls -lh rules/


      # ============================================================
      # 9. Create README
      # ============================================================
      - name: Create README
        shell: bash
        run: |
          cat > rules/README.md <<'EOF'
          # AdvertisingLite for Stash

          Automatically generated from Blackmatrix7 AdvertisingLite.

          ## Files

          ### AdvertisingLite-Domain.mrs

          Contains:

          - DOMAIN
          - DOMAIN-SUFFIX

          Optimized MRS domain rule set.

          ### AdvertisingLite-Keyword.yaml

          Contains:

          - DOMAIN-KEYWORD

          Kept as classical YAML because MRS domain format cannot preserve DOMAIN-KEYWORD semantics.

          ### AdvertisingLite-IP.mrs

          Contains:

          - IP-CIDR
          - IP-CIDR6

          Optimized MRS IP rule set.

          ## Stash

          Recommended configuration:

          ```yaml
          rule-providers:

            AdvertisingLite-Domain:
              type: http
              behavior: domain
              format: mrs
              url: https://raw.githubusercontent.com/USERNAME/REPOSITORY/main/rules/AdvertisingLite-Domain.mrs
              interval: 86400

            AdvertisingLite-Keyword:
              type: http
              behavior: classical
              format: yaml
              url: https://raw.githubusercontent.com/USERNAME/REPOSITORY/main/rules/AdvertisingLite-Keyword.yaml
              interval: 86400

            AdvertisingLite-IP:
              type: http
              behavior: ipcidr
              format: mrs
              url: https://raw.githubusercontent.com/USERNAME/REPOSITORY/main/rules/AdvertisingLite-IP.mrs
              interval: 86400

          rules:

            - RULE-SET,AdvertisingLite-Domain,REJECT
            - RULE-SET,AdvertisingLite-Keyword,REJECT
            - RULE-SET,AdvertisingLite-IP,REJECT
          ```

          The DOMAIN and IP rule sets use MRS for low memory usage and fast matching.

          DOMAIN-KEYWORD remains classical because converting it to domain MRS would change its matching semantics.
          EOF


      # ============================================================
      # 10. Commit generated files
      # ============================================================
      - name: Commit generated rules
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update AdvertisingLite rules"

          git push
name: Build AdvertisingLite MRS

on:
  schedule:
    # 每天 UTC 02:30
    # 北京时间 / 日本时间 10:30
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. 获取自己的仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 下载 Blackmatrix7 AdvertisingLite
      - name: Download AdvertisingLite
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.list" \
            -o AdvertisingLite_Domain.list

          echo "Downloaded rule:"
          wc -l AdvertisingLite_Domain.list
          ls -lh AdvertisingLite_Domain.list

      # 3. 下载 Mihomo
      - name: Download Mihomo
        run: |
          set -e

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep '"browser_download_url":' \
            | grep 'linux-amd64-compatible' \
            | grep -v '\.sha256' \
            | head -n 1 \
            | cut -d '"' -f 4)

          echo "Mihomo URL:"
          echo "$URL"

          curl -fL "$URL" -o mihomo.gz

          gzip -d mihomo.gz

          chmod +x mihomo

          ./mihomo -v

      # 4. 转换 MRS
      - name: Convert to MRS
        run: |
          set -e

          ./mihomo convert-ruleset \
            domain \
            text \
            AdvertisingLite_Domain.list \
            AdvertisingLite_Domain.mrs

      # 5. 检查结果
      - name: Validate MRS
        run: |
          set -e

          if [ ! -s AdvertisingLite_Domain.mrs ]; then
            echo "ERROR: MRS file is empty!"
            exit 1
          fi

          echo "Original:"
          ls -lh AdvertisingLite_Domain.list

          echo "MRS:"
          ls -lh AdvertisingLite_Domain.mrs

      # 6. 创建 / 更新 Release
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AdvertisingLite MRS
          body: |
            Automatically converted from Blackmatrix7 AdvertisingLite.

            Source:
            https://github.com/blackmatrix7/ios_rule_script

            Generated by Mihomo convert-ruleset.

            This is the domain-only MRS version.
          files: |
            AdvertisingLite_Domain.mrs
          prerelease: false
          make_latest: true
